<svg xmlns="http://w3.org" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente de Fundo Vermelho Glorioso -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#e31c2d" />
      <stop offset="60%" stop-color="#99000a" />
      <stop offset="100%" stop-color="#4a0003" />
    </radialGradient>
    
    <!-- Gradiente Dourado de Alta Definição -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4b8" />
      <stop offset="35%" stop-color="#f4c430" />
      <stop offset="100%" stop-color="#a37a00" />
    </linearGradient>

    <!-- Sombra Projetada Realista -->
    <filter id="slbShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- 1. Círculo de Fundo do Ícone -->
  <circle cx="256" cy="256" r="235" fill="url(#bgGrad)" stroke="#ffffff" stroke-width="6" filter="url(#slbShadow)" />
  <circle cx="256" cy="256" r="224" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="6,4" opacity="0.4" />

  <!-- 2. EMBLEMA DETALHADO DO BENFICA (Vetor Puro) -->
  <g transform="translate(256, 215)" filter="url(#slbShadow)">
    
    <!-- A ÁGUIA (Asas abertas em detalhe) -->
    <path d="M -140,-50 C -110,-95 -50,-90 0,-55 C 50,-90 110,-95 140,-50 C 100,-35 40,-45 0,-25 C -40,-45 -100,-35 -140,-50 Z" fill="url(#goldGrad)" />
    <!-- Penas detalhadas das asas -->
    <path d="M -135,-45 C -95,-25 -45,-35 0,-15 C -45,-35 -95,-25 -135,-45 Z" fill="#4a0003" opacity="0.3" />
    <path d="M 135,-45 C 95,-25 45,-35 0,-15 C 45,-35 95,-25 135,-45 Z" fill="#4a0003" opacity="0.3" />
    <!-- Cabeça da Águia -->
    <path d="M -12,-55 C -12,-72 0,-78 0,-78 C 0,-78 8,-72 8,-62 C 8,-52 -2,-48 -12,-55 Z" fill="#ffffff" />
    <path d="M 8,-66 L 18,-60 L 6,-54 Z" fill="url(#goldGrad)" /> <!-- Bico -->

    <!-- A RODA DE BICICLETA (Mística do Clube) -->
    <circle cx="0" cy="20" r="65" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="12" />
    <circle cx="0" cy="20" r="53" fill="none" stroke="#000000" stroke-width="1" opacity="0.2" />
    <!-- Raios da Roda -->
    <g stroke="url(#goldGrad)" stroke-width="2" opacity="0.7">
      <line x1="0" y1="-45" x2="0" y2="85" />
      <line x1="-65" y1="20" x2="65" y2="20" />
      <line x1="-46" y1="-26" x2="46" y2="66" />
      <line x1="46" y1="-26" x2="-46" y2="66" />
    </g>

    <!-- O ESCUDO CENTRAL -->
    <g transform="translate(0, 20)">
      <!-- Forma do Escudo Principal -->
      <path d="M -35,-15 L 35,-15 L 35,15 C 35,45 0,55 0,55 C 0,55 -35,45 -35,15 Z" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="5" />
      <!-- Metade Esquerda: Vermelho Benfica -->
      <path d="M -32.5,-12.5 L 0,-12.5 L 0,52 C -2,-52 -32.5,42 -32.5,15 Z" fill="#e31c2d" />
      
      <!-- FAIXA DIAGONAL (S.L.B.) -->
      <path d="M -38,5 L 38,18 L 34,29 L -38,16 Z" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="2" />
      <path d="M -37,6 L 37,19 L 34,28 L -37,15 Z" fill="#002d62" />
      <!-- Texto S.L.B. dentro da faixa -->
      <text x="0" y="21" font-family="'Arial Black', sans-serif" font-size="10" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" transform="rotate(10)" letter-spacing="2">S.L.B.</text>
    </g>
  </g>

  <!-- 3. LETREIRO INFERIOR: ONZE INICIAL -->
  <g filter="url(#slbShadow)">
    <text x="256" y="450" 
          font-family="'Impact', 'Arial Black', sans-serif" 
          font-size="46" 
          font-weight="900" 
          letter-spacing="3"
          fill="url(#goldGrad)" 
          stroke="#000000"
          stroke-width="1"
          text-anchor="middle">
      ONZE INICIAL
    </text>
  </g>
</svg>
