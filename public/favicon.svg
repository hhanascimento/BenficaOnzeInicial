<svg xmlns="http://w3.org" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente Vermelho Premium para o Fundo -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#e31c2d" />
      <stop offset="100%" stop-color="#99000a" />
    </radialGradient>
    
    <!-- Gradiente Dourado de Alta Definição para as Letras -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4b8" />
      <stop offset="50%" stop-color="#f4c430" />
      <stop offset="100%" stop-color="#b8860b" />
    </linearGradient>

    <!-- Sombra Projetada para dar relevo -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Fundo Quadrado com Cantos Arredondados Fundo Vermelho Benfica -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)" />
  
  <!-- Moldura interior dourada elegante -->
  <rect x="20" y="20" width="472" height="472" rx="76" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.8" />

  <!-- TEXTO CENTRADO: BENFICA ONZE INICIAL -->
  <g filter="url(#dropShadow)" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" text-anchor="middle">
    <text x="256" y="180" font-size="64" fill="#ffffff" letter-spacing="4">BENFICA</text>
    <text x="256" y="290" font-size="74" fill="url(#goldGrad)" letter-spacing="2">ONZE</text>
    <text x="256" y="400" font-size="74" fill="url(#goldGrad)" letter-spacing="2">INICIAL</text>
  </g>
</svg>
